[package]
name = "netme"
version = "0.0.1"
edition = "2021"
description = "An honest, unprivileged network monitor for macOS and Linux"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nicholasxjy/netme"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "socks-proxy"] }
signal-hook = "0.3"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
